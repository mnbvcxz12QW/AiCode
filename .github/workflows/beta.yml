name: Beta Build

# push 到 main 时自动构建一个测试包（Debug版，免签名，可直接安装）。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 构建 universal debug（注意这里改成了 Debug 模式，不需要密钥）
      - name: Build universal debug APK
        run: ./gradlew :app:assembleUniversalDebug --stacktrace

      # 产物重命名
      - name: Rename APK
        run: |
          set -e
          mkdir -p dist
          sha7="${GITHUB_SHA::7}"
          cp "app/build/outputs/apk/universal/debug/app-universal-debug.apk" \
             "dist/aicode-universal-debug-${sha7}.apk"
          ls -lh dist/

      - name: Upload APK artifac
        uses: actions/upload-artifact@v4
        with:
          name: aicode-beta-${{ github.sha }}
          path: dist/aicode-universal-debug-*.apk
          if-no-files-found: error
